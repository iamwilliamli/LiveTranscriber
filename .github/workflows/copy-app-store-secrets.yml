name: Copy App Store secrets to private repository

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: app-store-production
    steps:
      - name: Copy encrypted environment secrets
        env:
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$MIGRATION_TOKEN"
          printf %s "$ASC_KEY_ID" | gh secret set ASC_KEY_ID --repo iamwilliamli/LiveTranscriber-Private --env app-store-production
          printf %s "$ASC_ISSUER_ID" | gh secret set ASC_ISSUER_ID --repo iamwilliamli/LiveTranscriber-Private --env app-store-production
          printf %s "$ASC_PRIVATE_KEY_BASE64" | gh secret set ASC_PRIVATE_KEY_BASE64 --repo iamwilliamli/LiveTranscriber-Private --env app-store-production
